<!-- app/templates/products/create.html -->
{% extends "base.html" %}

{% block title %}Add Product{% endblock %}
{% block header %}Add New Product{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="name" class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category_id" class="form-label">Category</label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            <option value="">Select Category</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <div class="input-group">
                            <span class="input-group-text">RM</span>
                            <input type="number" 
                                   step="0.01" 
                                   class="form-control" 
                                   id="price" 
                                   name="price" 
                                   value="{{ product.price if product else '' }}"
                                   required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="stock_quantity" class="form-label">Initial Stock</label>
                        <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" value="0" required>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('main.product_list') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Product</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
